name: Fetch available slots

on:
  schedule:
    # 00:00 Bangladesh time (UTC+6)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch slots
        run: python fetch_slots.py -w 12

      - name: Commit CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add available_slots_12w.csv
          if git diff --staged --quiet; then
            echo "No slot changes"
          else
            git commit -m "Update available slots CSV"
            git push
          fi
